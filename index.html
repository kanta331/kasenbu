<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>下線部</title>
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="下線部">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#f6f3ec; --face:#fffdf8; --ink:#1d1b16; --muted:#6c675c; --line:#dcd4c2; --btn:#1d1b16; --btnink:#fffdf8;
  /* 意味にだけ使う5色：主語・述語・節・指示語・論理語 */
  --subj:#13805f; --verb:#c7362b; --clause:#2f6fc4; --ref:#7a63d6; --logic:#a87a1c;
  --serif:"Iowan Old Style","Palatino","Georgia",serif;
  --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16191b; --face:#1f2326; --ink:#ece6d8; --muted:#9aa39b; --line:#353b3e; --btn:#ece6d8; --btnink:#16191b;
    --subj:#43c29a; --verb:#f0675b; --clause:#6fa3ef; --ref:#a996f2; --logic:#e0b453; }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }
body{ min-height:100dvh; }
#app{ max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px); }
h1{ font-size:20px; margin:0 0 4px; font-weight:700; }
h2{ font-size:15px; margin:22px 0 8px; color:var(--muted); font-weight:600; }
p{ line-height:1.7; }
.muted{ color:var(--muted); font-size:13px; }
button{ font:inherit; color:inherit; }
.btn{ display:block; width:100%; min-height:56px; border:0; border-radius:14px; background:var(--btn); color:var(--btnink); font-size:18px; font-weight:700; cursor:pointer; }
.btn.sub{ background:transparent; color:var(--ink); border:1.5px solid var(--line); font-weight:600; font-size:16px; min-height:50px; }
.btn + .btn{ margin-top:10px; }
.dock{ position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(env(safe-area-inset-bottom) + 12px); background:linear-gradient(transparent, var(--bg) 30%); }
.dock > *{ max-width:528px; margin:0 auto; }
.link{ background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline; padding:8px 4px; cursor:pointer; }
.top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }

/* ホーム */
.stats{ display:flex; gap:10px; margin:10px 0 4px; }
.stat{ flex:1; background:var(--face); border:1px solid var(--line); border-radius:14px; padding:12px; }
.stat b{ display:block; font-size:28px; font-variant-numeric:tabular-nums; }
.stat span{ font-size:12px; color:var(--muted); }
.year{ margin:14px 0 4px; font-size:13px; color:var(--muted); }
.bosses{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.boss{ background:var(--face); border:1.5px solid var(--line); border-radius:12px; padding:8px 6px; min-height:76px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
.boss .lbl{ font-weight:700; font-size:14px; }
.boss .st{ font-size:12px; color:var(--muted); }
.boss.defeated{ border-color:var(--ink); }
.boss.defeated .st{ color:var(--ink); font-weight:700; }
.boss.next{ border-style:solid; border-width:2.5px; border-color:var(--ink); }
.boss.sealed{ border-style:dashed; background:transparent; }
.tags{ display:flex; flex-wrap:wrap; gap:2px; }
.tag{ font-size:9.5px; letter-spacing:.02em; border:1px solid var(--line); border-radius:4px; padding:0 3px; color:var(--muted); }

/* 解剖 */
.qhead{ display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:6px; }
.prompt{ font-size:16px; font-weight:700; margin:4px 0 14px; line-height:1.6; }
.sent{ font-family:var(--serif); font-size:22px; line-height:2.25; background:var(--face); border:1px solid var(--line); border-radius:16px; padding:14px 12px; word-break:normal; }
.sent.prev{ font-size:18px; line-height:2; color:var(--muted); margin-bottom:10px; }
.tok{ display:inline-block; padding:2px 0; border-radius:7px; cursor:default; }
/* 押せる範囲は左右に広げ、見た目の間隔は変えない */
.tok.tap{ cursor:pointer; padding:2px 4px; margin:0 -4px; }
.tok.tap:active{ background:var(--line); }
.tok.picked{ outline:2px solid var(--ink); }
.tok.subj{ text-decoration:underline; text-decoration-color:var(--subj); text-decoration-thickness:3px; text-underline-offset:6px; }
.tok.verb{ font-weight:800; color:var(--verb); }
.tok.ref{ color:var(--ref); font-weight:700; }
.tok.refdst{ background:color-mix(in srgb, var(--ref) 18%, transparent); }
.tok.logic{ color:var(--logic); font-weight:700; }
.tok.head{ box-shadow:inset 0 -2px 0 var(--clause); }
.tok.hole{ font-family:var(--sans); font-size:17px; color:var(--muted); }
.br{ color:var(--clause); font-weight:700; font-family:var(--sans); }
.choices{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.choice{ text-align:left; padding:14px; border:1.5px solid var(--line); background:var(--face); border-radius:14px; font-size:16px; line-height:1.6; min-height:56px; cursor:pointer; }
.choice.right{ border-color:var(--subj); border-width:3px; }
.choice.wrong{ border-color:var(--verb); border-width:3px; }
.logicbtns{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:14px; }
.logicbtns .choice{ text-align:center; padding:14px 0; font-weight:700; }
.verdict{ font-size:18px; font-weight:800; margin:16px 0 6px; }
.explain{ margin-top:8px; }
.explain .sent{ font-size:20px; }
.legend{ font-size:12px; color:var(--muted); margin:6px 2px 0; line-height:1.9; }
.legend i{ font-style:normal; font-weight:700; }
.kv{ margin:12px 0 0; padding:12px 14px; background:var(--face); border:1px solid var(--line); border-radius:14px; }
.kv dt{ font-size:12px; color:var(--muted); margin-top:8px; }
.kv dt:first-child{ margin-top:0; }
.kv dd{ margin:2px 0 0; line-height:1.7; font-size:16px; }
.yours{ padding:10px 14px; border-left:4px solid var(--verb); background:var(--face); border-radius:6px; margin-top:10px; line-height:1.6; font-size:15px; }

/* 基礎講座 */
.ltitle{ font-size:20px; margin:4px 0 6px; }
.lgoal{ color:var(--muted); margin:0 0 10px; font-size:14px; }
.lsay{ font-size:17px; line-height:1.85; margin:8px 0 14px; }
.lja{ font-size:17px; line-height:1.7; margin:12px 2px 0; }
.lnote{ font-size:13px; color:var(--muted); text-align:center; margin:0 auto 8px; background:var(--bg); width:fit-content; padding:2px 10px; border-radius:8px; }
.tok.dim{ opacity:.45; }
.nw{ white-space:nowrap; }
.llist{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.lrow{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px; min-height:56px; border:1.5px solid var(--line); background:var(--face); border-radius:14px; color:var(--ink); font-size:15px; font-family:var(--sans); cursor:pointer; }
.lrow.off{ background:transparent; color:var(--muted); cursor:default; }
.lno{ width:1.6em; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
.lname{ flex:1; line-height:1.5; }
.lst{ font-size:12px; color:var(--muted); white-space:nowrap; }
.lst.done{ color:var(--ink); font-weight:700; }

/* Claude先生（LINE 風。右＝KANTAくん、左＝先生。色は使わない） */
.chat{ margin-top:22px; padding-top:14px; border-top:1px solid var(--line); }
.chat-h{ font-size:14px; font-weight:700; margin-bottom:10px; }
.chat-log{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.msg{ display:flex; gap:8px; align-items:flex-start; }
.msg.k{ flex-direction:row-reverse; }
.msg .av{ flex:none; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--muted); background:var(--face); }
.msg .bub{ max-width:80%; }
.msg .who{ display:block; font-size:11px; color:var(--muted); margin:0 4px 2px; }
.msg.k .who{ text-align:right; }
.msg p{ margin:0; padding:10px 12px; border-radius:16px; line-height:1.7; font-size:15px; background:var(--face); border:1px solid var(--line); white-space:pre-wrap; }
.msg.k p{ background:var(--btn); color:var(--btnink); border-color:var(--btn); }
.msg.typing p{ color:var(--muted); }
.msg.err p{ color:var(--muted); font-size:13px; }
.chat form{ display:grid; gap:8px; }
.chat textarea{ width:100%; font:inherit; font-size:16px; line-height:1.6; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--face); color:var(--ink); resize:vertical; }
.chat .btn{ min-height:48px; font-size:16px; }
.chat-key{ display:grid; gap:8px; margin-bottom:10px; }
.chat-key[hidden]{ display:none; }
.chat-key input{ font-size:16px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--face); color:var(--ink); }
.link.ask{ padding:0 2px; }
#app:has(.dock .btn + .btn){ padding-bottom:calc(env(safe-area-inset-bottom) + 170px); }

/* 今日の戦績（ストーリー用。9:16）。暗い地、色は意味の色だけ */
.story{ position:fixed; inset:0; z-index:60; background:#0f1214; display:flex; justify-content:center; align-items:center; overflow:auto;
  --ink:#ece6d8; --muted:#9aa39b; --line:#33393c; --face:#171b1e; --subj:#43c29a; --verb:#f0675b; --clause:#6fa3ef; --ref:#a996f2; --logic:#e0b453; color:var(--ink); }
.story-card{ width:min(100vw, calc(100dvh * 9 / 16)); min-height:min(100dvh, calc(100vw * 16 / 9)); padding:calc(env(safe-area-inset-top) + 28px) 22px 24px; display:flex; flex-direction:column; gap:12px; }
.s-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--muted); letter-spacing:.08em; }
.s-logo{ font-family:var(--serif); font-size:22px; font-weight:700; color:var(--ink); letter-spacing:.25em; border-bottom:2px solid var(--subj); padding-bottom:2px; }
.s-days{ font-size:14px; letter-spacing:.1em; color:var(--muted); } .s-days b{ font-size:22px; color:var(--ink); }
.s-big{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; text-align:center; margin-top:6px; }
.s-big b{ display:block; font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
.s-big small{ font-size:14px; font-weight:700; margin:0 3px; }
.s-big span{ font-size:12px; color:var(--muted); letter-spacing:.1em; }
.s-sub{ font-size:12px; color:var(--muted); text-align:center; line-height:1.7; }
.story .radar{ max-width:300px; }
.s-changes{ list-style:none; padding:0; margin:0; display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; }
.s-changes li{ display:flex; align-items:baseline; gap:6px; font-size:14px; }
.s-changes b{ font-size:18px; font-variant-numeric:tabular-nums; } .s-changes i{ font-style:normal; font-size:12px; font-weight:800; }
.s-changes .down i, .s-changes .down b{ color:var(--muted); }
.s-none{ font-size:13px; color:var(--muted); text-align:center; margin:0; }
.s-say{ display:flex; gap:10px; align-items:flex-start; margin-top:auto; }
.s-say .av{ flex:none; width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-weight:700; color:var(--muted); }
.s-say p{ margin:0; padding:10px 14px; border-radius:16px; border:1px solid var(--line); background:var(--face); line-height:1.75; font-size:15px; }
.s-say small{ display:block; font-size:11px; color:var(--muted); margin-bottom:2px; }
.s-close{ position:fixed; top:calc(env(safe-area-inset-top) + 6px); right:10px; z-index:61; background:none; border:0; color:#5d6468; font-size:22px; padding:8px 12px; cursor:pointer; }

/* ボスの装甲（docs/GAME.md ステップ3 簡易版） */
.boss .armor{ display:block; height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:2px; }
.boss .armor > i{ display:block; height:100%; background:var(--ink); }
.boss.ready{ border-color:var(--ink); border-width:2.5px; animation:ready 1.6s ease-in-out infinite; }
.boss .rdy{ color:var(--ink); font-weight:800; }
@keyframes ready{ 50%{ box-shadow:0 0 0 4px color-mix(in srgb, var(--ink) 15%, transparent); } }
.armor-note{ font-size:13px; margin:6px 2px; } .armor-note b{ font-weight:800; }
@media (prefers-reduced-motion:reduce){ .boss.ready{ animation:none; } }

/* 対戦（docs/GAME.md ステップ2） */
.hp{ font-variant-numeric:tabular-nums; letter-spacing:.05em; color:var(--ink); }
.hp.big{ display:inline-block; margin-left:10px; font-size:15px; }
.skills{ margin:6px 0 10px; }
.skills-h{ font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px; }
.skillbtns{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.skillbtn{ border:1.5px solid var(--line); background:var(--face); color:var(--ink); border-radius:12px; padding:10px 6px; min-height:64px; font-family:var(--sans); font-size:13px; line-height:1.35; cursor:pointer; display:flex; flex-direction:column; justify-content:center; gap:3px; }
.skillbtn small{ color:var(--muted); font-size:11px; }
.skillbtn.picked{ border-color:var(--ink); border-width:3px; }
.skillbtn.off{ opacity:.4; }
.skillbtn.good{ border-color:var(--subj); border-width:3px; opacity:1; }
.skillbtn.bad{ border-color:var(--verb); border-width:3px; opacity:1; }
#app.locked .tok.tap, #app.locked .choice{ opacity:.45; }
.verdict.crit{ font-size:22px; letter-spacing:.05em; animation:crit .45s ease-out; }
@keyframes crit{ 0%{ transform:scale(.8); opacity:0; } 60%{ transform:scale(1.08); } 100%{ transform:none; opacity:1; } }
.sensei-say{ display:flex; gap:8px; align-items:flex-start; margin:10px 0 6px; }
.sensei-say .av{ flex:none; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--muted); background:var(--face); }
.sensei-say p{ margin:0; padding:9px 12px; border-radius:16px; background:var(--face); border:1px solid var(--line); line-height:1.7; font-size:15px; }
.missing{ font-size:13px; color:var(--muted); margin:4px 2px; }
h1.win{ letter-spacing:.15em; animation:crit .5s ease-out; } h1.lose{ color:var(--muted); letter-spacing:.15em; }
.reward{ font-weight:700; margin:0 0 6px; }
.xp{ display:block; height:3px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; }
.xp > i{ display:block; height:100%; background:var(--ink); }
.lst b{ display:block; color:var(--ink); font-size:13px; }
@media (prefers-reduced-motion:reduce){ .verdict.crit, h1.win{ animation:none; } }

/* ステータス（docs/GAME.md 3.5）。線だけ。色はパラメータ名の意味の色だけ */
.status{ background:var(--face); border:1px solid var(--line); border-radius:16px; padding:12px 12px 8px; margin:12px 0 6px; }
.status-h{ font-size:14px; font-weight:700; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.status-h .muted{ font-size:11px; font-weight:400; }
.radar{ display:block; width:100%; max-width:320px; margin:0 auto; }
.r-grid{ fill:none; stroke:var(--line); stroke-width:1; }
.r-line{ fill:none; stroke:var(--muted); stroke-width:1.2; stroke-dasharray:4 4; }
.r-me{ fill:color-mix(in srgb, var(--ink) 10%, transparent); stroke:var(--ink); stroke-width:2; stroke-linejoin:round; }
.r-lbl{ font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:middle; font-family:var(--sans); }
.r-val{ font-size:12px; text-anchor:middle; dominant-baseline:middle; fill:var(--muted); font-family:var(--sans); font-variant-numeric:tabular-nums; }
.rust{ font-size:12px; color:var(--muted); margin:2px 4px 4px; line-height:1.6; }
.changes{ list-style:none; padding:0; margin:6px 0 16px; border:1px solid var(--line); border-radius:14px; background:var(--face); }
.changes li{ display:grid; grid-template-columns:4.5em 1fr auto; align-items:center; gap:4px 8px; padding:10px 14px; border-top:1px solid var(--line); animation:cin .35s ease-out both; }
.changes li:first-child{ border-top:0; }
.c-name{ font-weight:700; }
.c-val{ font-variant-numeric:tabular-nums; } .c-val b{ font-size:20px; }
.c-diff{ font-weight:800; font-variant-numeric:tabular-nums; }
.changes .down .c-diff, .changes .down .c-val b{ color:var(--muted); }
.changes .down{ animation-name:cdown; }
.c-best{ grid-column:1 / -1; font-size:12px; font-weight:800; letter-spacing:.1em; }
@keyframes cin{ from{ opacity:0; transform:translateY(8px); } }
@keyframes cdown{ 0%{ opacity:0; transform:translateY(-6px); } 60%{ transform:translateY(3px); } 100%{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .changes li{ animation:none; } }

/* タイトル（docs/GAME.md ステップ1）：暗い地に、英文1行・下線・ロゴ・残り日数。色は文字色と下線の1色だけ */
.title-screen{ position:fixed; inset:0; z-index:50; background:#0f1214; color:#e9e3d4; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center; transition:opacity .25s; }
.title-screen.out{ opacity:0; pointer-events:none; }
.t-sent{ font-family:var(--serif); font-size:17px; line-height:1.6; max-width:30em; opacity:.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; animation:tfade .45s ease-out both; }
.t-line{ width:min(78%, 26em); height:2px; background:#43c29a; margin:10px auto 0; transform-origin:left; animation:draw .5s .3s cubic-bezier(.2,.8,.2,1) both; }
.t-logo{ font-family:var(--serif); font-size:52px; font-weight:700; letter-spacing:.3em; margin:48px 0 0 .3em; animation:tfade .5s .65s ease-out both; }
.t-days{ font-size:14px; letter-spacing:.2em; opacity:.6; margin-top:14px; animation:tfade .4s .95s ease-out both; }
@keyframes tfade{ from{ opacity:0; transform:translateY(6px); } }
.t-sent{ animation-name:tfadeh; } @keyframes tfadeh{ from{ opacity:0; } to{ opacity:.5; } }
.score{ font-size:18px; margin:4px 0 14px; } .score b{ font-size:32px; }
.link.speak{ margin-right:10px; }
.lname small{ display:block; font-size:12px; color:var(--muted); margin-top:2px; }
@media (prefers-reduced-motion:reduce){ .t-sent,.t-line,.t-logo,.t-days{ animation:none; } }

/* 演出は2つだけ：正解時の短い動き／ボス撃破 */
.hit{ animation:hit .32s ease-out; }
@keyframes hit{ 0%{ transform:scale(1); } 40%{ transform:scale(1.06); } 100%{ transform:scale(1); } }
.verdict.ok{ display:inline-block; position:relative; }
.verdict.ok::after{ content:""; position:absolute; left:0; right:0; bottom:-3px; height:3px; background:var(--ink); transform-origin:left; animation:draw .35s ease-out both; }
@keyframes draw{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
.slay{ text-align:center; padding:28px 0 8px; }
.slay h1{ display:inline-block; position:relative; font-size:56px; letter-spacing:.2em; margin:0 0 0 .2em; animation:rise .5s ease-out both; }
.slay h1::after{ content:""; position:absolute; left:-.1em; right:.1em; bottom:-6px; height:6px; background:var(--ink); transform-origin:left; animation:draw .45s .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
.slaycount{ margin-top:22px; animation:rise .4s .7s ease-out both; }
.slaycount b{ display:inline-block; font-size:40px; font-variant-numeric:tabular-nums; }
.slaycount small{ font-size:18px; font-weight:700; }
.slaycount span{ display:block; font-size:13px; color:var(--muted); margin-top:2px; }
.slaycount b.tick{ animation:tick .4s ease-out; }
@keyframes tick{ 0%{ transform:translateY(-12px); opacity:0; } 100%{ transform:none; opacity:1; } }
@media (prefers-reduced-motion:reduce){ .hit,.verdict.ok::after,.slay h1,.slay h1::after,.slaycount,.slaycount b.tick{ animation:none; } }

/* ボス戦 */
.timer{ position:sticky; top:0; background:var(--bg); padding:8px 0; font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; text-align:center; z-index:2; }
.timer.over{ color:var(--verb); }
.passage{ font-family:var(--serif); font-size:19px; line-height:1.9; }
.passage p{ margin:0 0 1em; text-indent:1em; line-height:1.9; }
.passage u{ text-decoration-thickness:2px; text-underline-offset:4px; }
.passage .mk{ font-family:var(--sans); font-size:13px; }
.cp{ font-size:18px; line-height:1.7; background:var(--face); border:1px solid var(--line); border-radius:16px; padding:18px 16px; margin:14px 0; }
.yesno{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
ul.plain{ padding-left:1.2em; line-height:1.7; }
textarea.copy{ position:fixed; left:-9999px; }
.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 96px); transform:translateX(-50%); background:var(--btn); color:var(--btnink); padding:10px 16px; border-radius:12px; font-size:14px; z-index:9; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="js/app.js"></script>
</body>
</html>
